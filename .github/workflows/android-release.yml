name: Android Release Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests (including 1000-beat precision suite)
        run: ./gradlew testDebugUnitTest

      - name: Decode Release Keystore (if configured in Secrets)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify 16KB Page Alignment & Rename APK
        run: |
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          TAG_NAME="${GITHUB_REF_NAME:-dev}"
          cp "$APK_SRC" "Tiny-Metronome-${TAG_NAME}-android16-release.apk"
          ls -lh "Tiny-Metronome-${TAG_NAME}-android16-release.apk"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiny-Metronome-Release-APK
          path: Tiny-Metronome-*-android16-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Tiny-Metronome ${{ github.ref_name }}"
          generate_release_notes: true
          files: Tiny-Metronome-*-android16-release.apk
